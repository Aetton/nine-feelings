plugins { id 'com.android.application' }
android {
    namespace 'ru.tochka.mood'
    compileSdk 36
    defaultConfig {
        applicationId 'ru.tochka.mood'
        minSdk 26
        targetSdk 36
        versionCode 6
        versionName '0.4.2'
        testInstrumentationRunner 'ru.tochka.mood.StoreInstrumentation'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    signingConfigs {
        debug {
            if (project.hasProperty('compatDebugKeystore')) {
                storeFile file(project.property('compatDebugKeystore'))
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
        release {
            def keyPath = System.getenv('NINE_FEELINGS_KEYSTORE')
            def passwordFile = System.getenv('NINE_FEELINGS_PASSWORD_FILE')
            if (keyPath && passwordFile) {
                storeFile file(keyPath)
                storePassword file(passwordFile).getText('UTF-8').trim()
                keyAlias 'release'
                keyPassword storePassword
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            debuggable false
            if (System.getenv('NINE_FEELINGS_KEYSTORE')) signingConfig signingConfigs.release
        }
    }
    lint { abortOnError true; checkReleaseBuilds true }
}
